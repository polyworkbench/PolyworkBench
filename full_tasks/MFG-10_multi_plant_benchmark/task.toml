files = ["benchmark_report.md", "plant_comparison.json", "inconsistency_findings.json", "recommendations.json", "analysis_script.py"]

[scoring]
entrypoint = "tests/test.sh"
schema = "tests/expected_output_schema.json"
rubric = "tests/rubric.md"
